<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="현아바라기" />
<meta name="theme-color" content="#FFF8F1" />
<title>현아바라기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF8F1; --card:#FFFFFF; --ink:#3E2B33; --sub:#8C7480;
  --sun:#F0A32E; --glow:#FF8A6B; --dusk:#7C6BAF; --rose:#E0607E;
  --line:#F2E1D5; --soft:#FDF0E6; --naver:#03C75A;
  --shadow:0 2px 14px rgba(196,140,116,.14);
  --disp:'Gowun Batang',serif; --body:'Gowun Dodum',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:contain}
button{font-family:var(--body);border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:var(--body);color:var(--ink)}
a{text-decoration:none}
#app{max-width:480px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--glow)}
.h2{font-family:var(--disp);font-size:25px;margin:6px 0 4px}
.lead{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.btn{background:linear-gradient(135deg,var(--sun),var(--glow));color:#fff;font-weight:700;font-size:14px;padding:12px 17px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 3px 10px rgba(255,138,107,.32)}
.btn:disabled{background:var(--line);color:var(--sub);box-shadow:none}
.btn.full{width:100%}
.ghost{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12.5px;padding:9px 13px;border-radius:11px;display:inline-flex;align-items:center;gap:6px}
.ghost.hot{color:var(--rose)} .ghost.sun{color:var(--sun)} .ghost.nv{color:var(--naver)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.1em;margin-bottom:5px;display:block}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;outline:none;margin-bottom:12px}
textarea.inp{resize:none;line-height:1.8;min-height:120px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12.5px;padding:7px 13px;border-radius:20px;background:var(--card);color:var(--sub);border:1px solid var(--line)}
.chip.on{background:var(--glow);color:#fff;border-color:var(--glow);font-weight:700}
.tag{font-family:var(--mono);font-size:9px;color:var(--dusk);border:1px solid var(--line);border-radius:20px;padding:2px 7px}
.muted{color:var(--sub);font-size:12.5px;line-height:1.7}
.empty{text-align:center;padding:48px 20px;color:var(--sub);font-family:var(--disp);font-size:15px;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,248,241,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;color:var(--sub);font-size:10.5px}
nav button.on{color:var(--glow)}
nav svg{width:20px;height:20px}
.spin{animation:sp 1.05s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-family:var(--mono);font-size:10px;color:var(--sub);padding:6px 0}
.cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;overflow:hidden}
.cell.blank{background:transparent;border:none}
.cell.today{border-color:var(--glow);border-width:2px}
.cell .n{font-family:var(--mono);font-size:12px;color:var(--ink)}
.cell.sun .n{color:var(--rose)}
.cell .thumb{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.9}
.cell .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(90,45,30,.55))}
.cell .n.onimg{color:#fff;position:relative;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.dot{width:5px;height:5px;border-radius:3px;background:var(--glow)}
.photoslot{aspect-ratio:1;border-radius:14px;border:1px dashed var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden;position:relative}
.photoslot img{width:100%;height:100%;object-fit:cover}
.mic{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--glow);flex-shrink:0;box-shadow:var(--shadow)}
.mic.rec{background:var(--rose);color:#fff;border-color:var(--rose);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,96,126,.5)}50%{box-shadow:0 0 0 12px rgba(224,96,126,0)}}
.sheet{position:fixed;inset:0;background:rgba(62,43,51,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet .in{width:100%;max-width:480px;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.stars svg{width:20px;height:20px}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:3px}
.bar i{display:block;height:4px;border-radius:3px;background:var(--sun)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;z-index:90;opacity:.95}
.hint{font-size:11.5px;color:var(--sub);line-height:1.6}
.sw{touch-action:pan-y}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script>
/* ========================= 아이콘 ========================= */
const I = {
  heart:'<path d="M19 14c1.5-1.5 3-3.3 3-5.5A5.5 5.5 0 0 0 12 6 5.5 5.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7Z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  wand:'<path d="m15 4 5 5L8 21l-5-5Z"/><path d="M20 3v4M18 5h4"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/>',
  sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19l-.1.1A2 2 0 1 1 5 16.3l.1-.1A1.6 1.6 0 0 0 4 13.6H4a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 5.2 7L5.1 6.9A2 2 0 1 1 7.9 4.1L8 4.2a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 17.4 4.2l.1-.1A2 2 0 1 1 20.3 7l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3Z"/>',
  rot:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  film:'<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 9h5M17 9h5M2 15h5M17 15h5"/>',
  play:'<path d="M6 4l14 8-14 8Z"/>',
  pause:'<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>',
  dl:'<path d="M12 3v12M7 11l5 5 5-5M4 21h16"/>',
  check:'<path d="m4 12 6 6L20 6"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
};
const ic = (n, sz, col, fill) => '<svg width="'+(sz||16)+'" height="'+(sz||16)+'" viewBox="0 0 24 24" fill="'+(fill||'none')+'" stroke="'+(col||'currentColor')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>';

/* ========================= 저장 ========================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('hnb:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('hnb:'+k, JSON.stringify(v)); }catch(e){ toast('저장 공간이 꽉 찼어'); } },
};
let _db = null;
function idb(){
  return new Promise((res, rej) => {
    if(_db) return res(_db);
    const r = indexedDB.open('hnb', 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains('img')) r.result.createObjectStore('img'); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function imgPut(id, data){ const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('img','readwrite'); t.objectStore('img').put(data, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function imgGet(id){ const db = await idb(); return new Promise((res) => { const t = db.transaction('img','readonly'); const q = t.objectStore('img').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }
async function imgDel(id){ const db = await idb(); return new Promise((res) => { const t = db.transaction('img','readwrite'); t.objectStore('img').delete(id); t.oncomplete = res; t.onerror = res; }); }
const IMG = {};

/* ========================= 상태 ========================= */
const S = {
  tab: 'home',
  settings: LS.get('settings', { me:'진한', you:'현아', start:'2024-01-01', region:'포항', key:'' }),
  whoami: LS.get('whoami', null),
  taste: LS.get('taste', {}),
  food: LS.get('food', []),
  travel: LS.get('travel', []),
  days: LS.get('days', {}),
  courses: LS.get('courses', []),
  cal: { y: new Date().getFullYear(), m: new Date().getMonth() },
  open: null, sheet: null, tmp: {},
};
if(!S.whoami) S.whoami = S.settings.me;
const save = (k) => LS.set(k, S[k]);

/* ========================= 유틸 ========================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Math.random().toString(36).slice(2,10);
const pad = (n) => String(n).padStart(2,'0');
const iso = (d) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const fmt = (s) => s ? s.replace(/-/g,'.') : '';
const dowKo = (s) => ['일','월','화','수','목','금','토'][new Date(s+'T00:00:00').getDay()];
const dbet = (a,b) => Math.floor((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
const ago = (s) => s ? dbet(s, today()) : 0;
const season = () => { const m = new Date().getMonth()+1; return (m<=2||m===12)?'겨울':m<=5?'봄':m<=8?'여름':'가을'; };
const naver = (q) => 'https://map.naver.com/p/search/'+encodeURIComponent(q);
const other = () => S.whoami === S.settings.me ? S.settings.you : S.settings.me;
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

/* ========================= AI ========================= */
async function ai(content, opt){
  opt = opt || {};
  if(!S.settings.key) throw new Error('NOKEY');
  const body = { model:'claude-sonnet-4-6', max_tokens:1400, messages:[{ role:'user', content: content }] };
  if(opt.search) body.tools = [{ type:'web_search_20250305', name:'web_search' }];
  if(opt.system) body.system = opt.system;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':S.settings.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message || 'API 오류');
  return (d.content||[]).map(c => c.type === 'text' ? c.text : '').filter(Boolean).join('\n');
}
async function aiJSON(content, opt){
  opt = Object.assign({}, opt, { system:'반드시 JSON만 출력한다. 설명, 인사말, 코드펜스 금지.' });
  const raw = await ai(content, opt);
  const c = raw.replace(/```json/g,'').replace(/```/g,'').trim();
  const a = c.indexOf('{'), b = c.lastIndexOf('}');
  return JSON.parse(a >= 0 ? c.slice(a, b+1) : c);
}
function aiErr(e){
  if(e && e.message === 'NOKEY'){ toast('우리 탭에서 API 키를 먼저 넣어줘'); return '우리 탭 > 설정에서 API 키를 넣으면 AI 기능이 켜져.'; }
  return 'AI 응답을 못 가져왔어. 잠시 뒤 다시 눌러줘.';
}
function tasteBrief(){
  const out = [];
  [S.settings.me, S.settings.you].forEach(n => {
    const t = S.taste[n];
    if(!t) return;
    out.push(n+' — 좋아함: '+(t.likes||'-')+' / 싫어함: '+(t.dislikes||'-')+' / 음식: '+(t.food||'-')+' / 여행: '+(t.travel||'-')+(t.memo?' / 메모: '+t.memo:''));
  });
  return out.join('\n') || '취향 기록 없음';
}

/* ========================= 날씨 ========================= */
const WMO = {0:['맑음','sun'],1:['대체로 맑음','sun'],2:['구름 조금','cloud'],3:['흐림','cloud'],45:['안개','cloud'],48:['안개','cloud'],51:['이슬비','rain'],53:['이슬비','rain'],55:['이슬비','rain'],61:['비','rain'],63:['비','rain'],65:['강한 비','rain'],71:['눈','cloud'],73:['눈','cloud'],75:['많은 눈','cloud'],80:['소나기','rain'],81:['소나기','rain'],82:['강한 소나기','rain'],95:['천둥번개','rain'],96:['천둥번개','rain'],99:['천둥번개','rain']};
async function weather(region, date){
  const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(region)+'&count=1&language=ko&format=json').then(r => r.json());
  if(!g.results || !g.results.length) throw new Error('‘'+region+'’ 지역을 못 찾았어.');
  const p = g.results[0];
  const w = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FSeoul&forecast_days=16').then(r => r.json());
  const i = w.daily.time.indexOf(date);
  if(i < 0) throw new Error('그 날짜는 예보 범위 밖이야. 오늘부터 15일 안으로 골라줘.');
  const m = WMO[w.daily.weather_code[i]] || ['알 수 없음','cloud'];
  return { place:p.name, label:m[0], icon:m[1], tmax:Math.round(w.daily.temperature_2m_max[i]), tmin:Math.round(w.daily.temperature_2m_min[i]), rain:w.daily.precipitation_probability_max[i]||0, wind:Math.round(w.daily.wind_speed_10m_max[i]) };
}
function wScore(w){
  const rain = Math.max(0, 100 - w.rain);
  const t = (w.tmax + w.tmin)/2;
  const temp = (t >= 15 && t <= 24) ? 100 : Math.max(0, 100 - Math.abs(t-19.5)*6);
  const wind = Math.max(0, 100 - Math.max(0, w.wind-15)*4);
  return Math.round(rain*.5 + temp*.4 + wind*.1);
}

/* ========================= 재방문 엔진 ========================= */
function revisit(){
  const best = {};
  S.food.forEach(f => {
    const k = f.name+'|'+f.area, d = ago(f.date);
    if(!best[k] || d < best[k].days) best[k] = { id:f.id, name:f.name, area:f.area, score:f.score, days:d };
  });
  return Object.keys(best).map(k => best[k]).filter(r => r.days >= 30 && r.score >= 4)
    .sort((a,b) => (b.score-a.score) || (b.days-a.days)).slice(0,5);
}

/* ========================= 홈 ========================= */
function skyColors(){
  const h = new Date().getHours();
  if(h>=5&&h<10) return ['#FFEEDC','#FFD3B0','#B7D3EC','아침'];
  if(h>=10&&h<16) return ['#FFF6E7','#FFDFAE','#AFCEEA','한낮'];
  if(h>=16&&h<20) return ['#FFD9A0','#FF9E7A','#A88CC4','노을'];
  return ['#9E8BD0','#E39A9A','#FFCBA5','밤'];
}
function dataURLtoBlob(d){
  const parts = d.split(','), mime = (parts[0].match(/:(.*?);/) || [,'image/jpeg'])[1];
  const bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}
async function savePhoto(key, id, n){
  const d = IMG[id];
  if(!d){ toast('사진을 찾지 못했어'); return; }
  const name = '현아바라기-' + key + '-' + n + '.jpg';
  try{
    const blob = dataURLtoBlob(d);
    const file = new File([blob], name, { type:blob.type });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file] });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
    toast('내려받았어');
  }catch(e){ if(e && e.name !== 'AbortError') toast('저장하지 못했어'); }
}
function showPhotoView(key, id){
  const rec = S.days[key];
  const list = (rec && rec.photos) ? rec.photos.filter(p => IMG[p]) : [id];
  let i = Math.max(0, list.indexOf(id));
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;z-index:85;background:rgba(34,20,28,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px';
  const paint = () => {
    el.innerHTML = '<img id="pvi" src="'+IMG[list[i]]+'" alt="" style="max-width:100%;max-height:74vh;border-radius:16px;display:block">'
      + '<div style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.7);margin-top:14px">'+fmt(key)+' · '+(i+1)+' / '+list.length+'</div>'

      + '<button id="pvc" style="background:#fff;color:var(--ink);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700">닫기</button></div>';

    el.querySelector('#pvs').onclick = () => savePhoto(key, list[i], i+1);

    if(pp) pp.onclick = () => { i = (i-1+list.length)%list.length; paint(); };
    if(pn) pn.onclick = () => { i = (i+1)%list.length; paint(); };

      const pid = list[i];
      if(rec){ rec.photos = rec.photos.filter(x => x !== pid); save('days'); }
      await imgDel(pid); delete IMG[pid];
      list.splice(i,1);
      if(!list.length){ el.remove(); render(); return; }
      i = i % list.length; paint(); render();
    };
  };
  paint();
  el.addEventListener('click', e => { if(e.target === el) el.remove(); });
  document.body.appendChild(el);
}

let REC = null, recOn = false;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $('#micbtn'), st = $('#micstate'), ta = $('#dtext');
  if(!SR){ toast('이 브라우저는 음성 입력을 지원하지 않아'); return; }
  if(recOn){ try{ REC.stop(); }catch(e){} return; }
  REC = new SR();
  REC.lang = 'ko-KR'; REC.continuous = true; REC.interimResults = true;
  let base = ta.value;
  REC.onstart = () => { recOn = true; btn.classList.add('rec'); btn.innerHTML = ic('stop',18,'#fff','#fff'); st.textContent = '듣는 중…'; };
  REC.onresult = (e) => {
    let fin = '', itr = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) fin += e.results[i][0].transcript;
      else itr += e.results[i][0].transcript;
    }
    if(fin){ base = (base ? base + (base.endsWith(' ')?'':' ') : '') + fin; }
    ta.value = base + (itr ? ' ' + itr : '');
    ta.scrollTop = ta.scrollHeight;
  };
  REC.onerror = (e) => { st.textContent = e.error === 'not-allowed' ? '마이크 권한이 필요해' : ''; };
  REC.onend = () => { recOn = false; btn.classList.remove('rec'); btn.innerHTML = ic('mic',20); st.textContent = ''; };
  try{ REC.start(); }catch(e){ toast('음성 인식을 시작하지 못했어'); }
}

  try{
    let r;
    try{ r = await aiJSON(prompt, { search:true }); }
    catch(e){ r = await aiJSON(prompt); }
    const sc = r.점수 || {};
    const bd = { 날씨: w ? wScore(w) : 70, 취향: sc.취향||80, 동선: sc.동선||80, 신선함: sc.신선함||80 };
    const total = Math.round(bd.날씨*.3 + bd.취향*.3 + bd.동선*.2 + bd.신선함*.2);
    S.tmp.plan = { id:uid(), title:r.제목, one:r.한줄, date:t.date, region:t.region, w:w, bd:bd, total:total, course:r.코스||[], cost:r.총예상비용, trend:r.트렌드, rainplan:r.우천대안, report:r.리포트, bring:(r.챙길것||[]).join(', ') };
    out.innerHTML = (warn ? '<p class="hint" style="color:var(--rose);margin-bottom:8px">'+esc(warn)+'</p>' : '') + planHTML(S.tmp.plan);
  }catch(e){ out.innerHTML = '<p class="hint" style="color:var(--rose)">'+esc(aiErr(e))+'</p>'; }
  btn.disabled = false; btn.innerHTML = ic('wand',15,'#fff')+' 코스 짜기';
}
function planHTML(p){

      + '<div style="font-family:var(--mono);font-size:9.5px;color:var(--glow);margin-top:3px">'+esc(s.종류||'')+(s.예상비용?' · '+esc(s.예상비용):'')+'</div></div>'
      + '<a href="'+naver(s.검색어 || (p.region+' '+s.장소))+'" target="_blank" style="color:var(--naver);flex-shrink:0">'+ic('pin',17)+'</a></div>'
      + '<p class="muted" style="margin-top:6px">'+esc(s.이유||'')+'</p></div></div>';
  });
  h += '</div></div>';
  [['총 비용',p.cost],['요즘 뜨는 것',p.trend],['비 오면',p.rainplan],['챙길 것',p.bring]].forEach(x => {
    if(x[1]) h += '<div style="display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line)"><span style="font-family:var(--mono);font-size:9.5px;color:var(--glow);width:66px;flex-shrink:0;padding-top:4px">'+x[0]+'</span><span style="font-size:13px;line-height:1.7">'+esc(x[1])+'</span></div>';
  });
  if(p.report) h += '<div style="background:var(--soft);border-radius:14px;padding:14px;margin-top:14px"><span class="eyebrow">총평</span><p style="font-family:var(--disp);font-size:14.5px;line-height:1.9;margin-top:6px">'+esc(p.report)+'</p></div>';
  h += '<div class="row" style="margin-top:14px"><button class="ghost sun" data-act="savecourse">'+ic('save',13)+' 이 코스 저장</button>'

function startBGM(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  const ctx = new AC();
  const master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
  const dl = ctx.createDelay(1); dl.delayTime.value = .33;
  const fb = ctx.createGain(); fb.gain.value = .3; dl.connect(fb); fb.connect(dl); dl.connect(master);
  const tone = (f,at,dur,type,vol,echo) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, at); g.gain.linearRampToValueAtTime(vol, at+.12);
    g.gain.exponentialRampToValueAtTime(.0001, at+dur);
    o.connect(g); g.connect(master); if(echo) g.connect(dl);
    o.start(at); o.stop(at+dur+.1);
  };
  const m = MOODS[S.tmp.mood]; let bar = 0, nt = ctx.currentTime + .15;
  const sch = () => {
    while(nt < ctx.currentTime + 1.5){
      const c = m.ch[bar % m.ch.length];
      c.forEach(n => tone(mtof(n-12), nt, m.bar*.95, 'sine', .075, false));
      c.forEach((n,k) => tone(mtof(n+12), nt+.25+k*(m.bar/6), m.bar/5, 'triangle', .05, true));
      nt += m.bar; bar++;
    }
  };
  sch();
  return { ctx:ctx, master:master, timer:setInterval(sch, 400) };
}
function stopBGM(){ if(!AUD) return; clearInterval(AUD.timer); try{ AUD.master.gain.setTargetAtTime(.0001, AUD.ctx.currentTime, .15); }catch(e){} const a = AUD; setTimeout(() => { try{ a.ctx.close(); }catch(e){} }, 600); AUD = null; }
async function playMovie(record){
  const list = allPhotos().filter(p => S.tmp.sel.indexOf(p.id) >= 0);
  if(!list.length){ toast('사진을 먼저 골라줘'); return; }
  const cv = $('#cv'), ctx = cv.getContext('2d'), W = 720, H = 1280;
  const imgs = {};
  await Promise.all(list.map(p => new Promise(res => { const im = new Image(); im.onload = () => { imgs[p.id] = im; res(); }; im.onerror = res; im.src = IMG[p.id]; })));
  const CLIP = 3.4, FADE = .55;
  const sc = [{ t:'in', d:2.6 }];
  list.forEach(p => sc.push({ t:'ph', d:CLIP, id:p.id, date:p.date, cap:p.cap }));
  sc.push({ t:'out', d:3.0 });
  let acc = 0; sc.forEach(s => { s.s = acc; acc += s.d; });
  const total = acc;
  AUD = startBGM();
  let chunks = [], rec = null;
  if(record){
    try{
      const st = cv.captureStream(30);
      if(AUD){ const dst = AUD.ctx.createMediaStreamDestination(); AUD.master.connect(dst); dst.stream.getAudioTracks().forEach(t => st.addTrack(t)); }
      const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      rec = new MediaRecorder(st, { mimeType:mime, videoBitsPerSecond:4000000 });
      rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const url = URL.createObjectURL(new Blob(chunks, { type:mime }));
        $('#mout').innerHTML = '<a class="btn full" style="margin-top:12px" href="'+url+'" download="hyunabaragi.'+(mime==='video/mp4'?'mp4':'webm')+'">'+ic('dl',15,'#fff')+' 영상 내려받기</a>';
      };
      rec.start(); RECD = rec;
    }catch(e){ $('#mout').innerHTML = '<p class="hint" style="color:var(--rose);margin-top:10px">이 브라우저에선 저장이 안 돼. 재생은 그대로 돼.</p>'; }
  }
  const sunsetBG = () => {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#A88CC4'); g.addColorStop(.45,'#FF9E7A'); g.addColorStop(1,'#FFD9A0');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(255,247,226,.95)'; ctx.beginPath(); ctx.arc(W/2, H*.42, 92, 0, 7); ctx.fill();
  };
  const draw = (s, lt, al) => {
    if(s.t === 'ph'){
      const im = imgs[s.id], k = lt/s.d;
      ctx.globalAlpha = al;
      if(im){
        const z = 1.04+k*.1, r = Math.max(W/im.width, H/im.height)*z, w = im.width*r, hh = im.height*r;
        ctx.drawImage(im, (W-w)/2+(k-.5)*30, (H-hh)/2-(k-.5)*20, w, hh);
      } else { ctx.fillStyle = '#EEDDD0'; ctx.fillRect(0,0,W,H); }
      const g = ctx.createLinearGradient(0,H*.55,0,H);
      g.addColorStop(0,'rgba(90,45,30,0)'); g.addColorStop(1,'rgba(90,45,30,.82)');
      ctx.fillStyle = g; ctx.fillRect(0,H*.55,W,H*.45);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFD9A0'; ctx.font = "500 26px 'IBM Plex Mono',monospace";
      ctx.fillText(fmt(s.date), 56, H-172);
      ctx.fillStyle = '#fff'; ctx.font = "400 42px 'Gowun Batang',serif";
      ctx.fillText((s.cap||'').slice(0,18), 56, H-110);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = al; sunsetBG(); ctx.textAlign = 'center';
      if(s.t === 'in'){
        ctx.fillStyle = '#8A4A22'; ctx.font = "500 24px 'IBM Plex Mono',monospace";
        ctx.fillText('HYUNABARAGI', W/2, H*.42+8);
        ctx.fillStyle = '#fff'; ctx.font = "700 54px 'Gowun Batang',serif";
        ctx.fillText('우리 기록', W/2, H*.42+190);
        ctx.font = "400 28px 'Gowun Dodum',sans-serif";
        ctx.fillText(S.settings.me+' & '+S.settings.you, W/2, H*.42+246);
      } else {
        ctx.fillStyle = '#fff'; ctx.font = "400 44px 'Gowun Batang',serif";
        ctx.fillText('앞으로도 계속, 우리.', W/2, H*.42+190);
        ctx.fillStyle = '#8A4A22'; ctx.font = "500 22px 'IBM Plex Mono',monospace";
        ctx.fillText(fmt(today()), W/2, H*.42+300);
      }
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
  };
  const t0 = performance.now();
  const tick = () => {
    const t = (performance.now()-t0)/1000;
    if(t >= total){ cancelAnimationFrame(RAF); stopBGM(); if(rec && rec.state !== 'inactive') setTimeout(() => rec.stop(), 250); return; }
    let i = 0; for(let j=0;j<sc.length;j++) if(t >= sc[j].s) i = j;
    const s = sc[i], lt = t-s.s, nx = sc[i+1], into = s.d-lt;
    ctx.clearRect(0,0,W,H);
    if(nx && into < FADE){ draw(s, lt, into/FADE); draw(nx, 0, 1-into/FADE); }
    else draw(s, lt, Math.min(1, lt/.4));
    RAF = requestAnimationFrame(tick);
  };
  RAF = requestAnimationFrame(tick);
}

function readFile(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('파일을 읽지 못했어'));
    r.readAsDataURL(file);
  });
}
function loadImg(src){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('이미지를 해석하지 못했어'));
    i.src = src;
  });
}
async function compress(file){
  const raw = await readFile(file);
  try{
    const img = await loadImg(raw);
    let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h) return raw;
    const max = 1400;
    if(w > h && w > max){ h = Math.round(h*max/w); w = max; }
    else if(h > max){ w = Math.round(w*max/h); h = max; }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const out = c.toDataURL('image/jpeg', .8);
    return (out && out.length > 200) ? out : raw;
  }catch(e){ return raw; }
}
function filePick(multiple, cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  if(multiple) inp.multiple = true;
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const files = Array.prototype.slice.call(inp.files || []);
    setTimeout(() => { try{ inp.remove(); }catch(e){} }, 100);
    if(files.length) cb(files);
  });
  inp.click();
}
function pickPhoto(key){
  filePick(true, async (files) => {
    if(S.open === key) saveDay(key, true);
    const rec = S.days[key] || (S.days[key] = { photos:[], text:'', title:'', score:0 });
    toast('사진 넣는 중…');
    let added = 0;
    for(const f of files){
      if(rec.photos.length >= 5) break;
      try{
        const data = await compress(f);
        const id = uid();
        IMG[id] = data;
        rec.photos.push(id);
        added++;
        try{ await imgPut(id, data); }
        catch(e){ toast('사진은 보이지만 저장은 실패했어'); }
      }catch(e){ toast(e.message || '사진을 넣지 못했어'); }
    }
    save('days');
    render();
    if(added) toast(added+'장 넣었어');
  });
}

/* ========================= 렌더 ========================= */
const TABS = [['home','홈','heart'],['calendar','캘린더','cal'],['date','데이트','wand'],['record','기록','book'],['us','우리','users']];
function render(){
  const app = $('#app');
  let h = '';
  if(S.tab === 'home') h = viewHome();
  else if(S.tab === 'calendar') h = S.open ? viewDay(S.open) : viewCalendar();
  else if(S.tab === 'date') h = viewDate();
  else if(S.tab === 'record') h = viewRecord();
  else if(S.tab === 'us') h = viewUs();
  else if(S.tab === 'movie') h = viewMovie();
  app.innerHTML = h;
  window.scrollTo(0, S.tab === 'calendar' && S.open ? 0 : window.__sy || 0);
  $('#nav').innerHTML = TABS.map(t => '<button data-act="go" data-v="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+ic(t[2],20,'currentColor',S.tab===t[0]&&t[0]==='home'?'currentColor':'none')+'<span>'+t[1]+'</span></button>').join('');
  if(S.tab === 'calendar' && S.open) bindSwipe();
}
function bindSwipe(){
  const el = $('#dayview');
  if(!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  el.addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(dx > 70 && Math.abs(dy) < 60){ saveDay(S.open, true); S.open = null; render(); }
    x0 = null;
  }, { passive:true });
}
function saveDay(key, silent){
  const ti = $('#dtitle'), tx = $('#dtext');
  if(!ti || !tx) return;
  const rec = S.days[key] || { photos:[], text:'', title:'', score:0 };
  rec.title = ti.value; rec.text = tx.value;
  if(!rec.title && !rec.text && !(rec.photos||[]).length && !rec.score) delete S.days[key];
  else S.days[key] = rec;
  save('days');
  if(!silent) toast('저장했어');
}

/* ========================= 이벤트 ========================= */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  window.__sy = window.scrollY;

  if(a === 'go'){ if(S.tab === 'calendar' && S.open) saveDay(S.open, true); S.open = null; S.tab = v; window.__sy = 0; render(); return; }
  if(a === 'settings'){ S.tab = 'us'; window.__sy = 0; render(); return; }
  if(a === 'mv'){ S.cal.m += parseInt(v,10); if(S.cal.m < 0){ S.cal.m = 11; S.cal.y--; } if(S.cal.m > 11){ S.cal.m = 0; S.cal.y++; } render(); return; }
  if(a === 'openday'){ S.tab = 'calendar'; S.open = v; window.__sy = 0; render(); return; }
  if(a === 'cover'){ pickCover(); return; }
  if(a === 'delcover'){ await imgDel('cover'); delete IMG['cover']; render(); return; }
  if(a === 'viewphoto'){ const p = v.split('|'); showPhotoView(p[0], p[1]); return; }
  if(a === 'addphoto'){ pickPhoto(v); return; }
  if(a === 'delphoto'){
    const p = v.split('|'), rec = S.days[p[0]];
    if(rec){ rec.photos = rec.photos.filter(x => x !== p[1]); await imgDel(p[1]); delete IMG[p[1]]; save('days'); render(); }
    return;
  }
  if(a === 'dscore'){ const p = v.split('|'); const rec = S.days[p[0]] || (S.days[p[0]] = { photos:[], text:'', title:'', score:0 }); rec.score = parseInt(p[1],10); saveDay(p[0], true); render(); return; }
  if(a === 'saveday'){ saveDay(v); render(); return; }
  if(a === 'delday'){ if(confirm('이 날 기록을 지울까?')){ const r = S.days[v]; if(r) for(const p of (r.photos||[])) await imgDel(p); delete S.days[v]; save('days'); S.open = null; render(); } return; }
  if(a === 'mic'){ toggleMic(); return; }
  if(a === 'tidy'){
    const tx = $('#dtext'), out = $('#tidyout');
    if(!tx.value.trim()){ toast('먼저 적거나 말해줘'); return; }
    out.innerHTML = '<p class="hint" style="margin-top:10px"><span class="spin">'+ic('sparkle',13)+'</span> 다듬는 중…</p>';
    try{
      const r = await aiJSON('연인이 하루를 마치고 남긴 메모다. 말한 그대로라 두서가 없을 수 있다. 사실은 바꾸지 말고 자연스러운 일기체로 다듬어줘. 반말, 3~6문장.\n\n메모:\n'+tx.value+'\n\nJSON: {"제목":"12자 이내","본문":""}');
      out.innerHTML = '<div class="card" style="margin-top:12px;border-color:var(--glow)"><span class="eyebrow">AI가 다듬은 글</span><div style="font-family:var(--disp);font-size:17px;margin:8px 0 6px">'+esc(r.제목||'')+'</div><p style="font-size:14px;line-height:1.9;white-space:pre-line">'+esc(r.본문||'')+'</p><button class="ghost sun" style="margin-top:12px" data-act="applytidy">'+ic('check',13)+' 이걸로 바꾸기</button></div>';
      S.tmp.tidy = r;
    }catch(err){ out.innerHTML = '<p class="hint" style="color:var(--rose);margin-top:10px">'+esc(aiErr(err))+'</p>'; }
    return;
  }
  if(a === 'applytidy'){ if(S.tmp.tidy){ $('#dtitle').value = S.tmp.tidy.제목 || ''; $('#dtext').value = S.tmp.tidy.본문 || ''; saveDay(S.open); render(); } return; }

  if(a === 'chip'){
    const p = v.split('|');
    if(p[0] === 'pmood') S.tmp.date.mood = p[1];
    if(p[0] === 'pbudget') S.tmp.date.budget = p[1];
    if(p[0] === 'pmove') S.tmp.date.move = p[1];
    if(p[0] === 'fkind') S.tmp.newfood.kind = p[1];
    if(p[0] === 'ttype') S.tmp.newtravel.type = p[1];
    if(p[0] === 'mmood') S.tmp.mood = p[1];
    if(p[0] === 'pmood' || p[0] === 'pbudget' || p[0] === 'pmove'){ S.tmp.date.date = $('#pdate').value; S.tmp.date.region = $('#pregion').value; }
    if(p[0] === 'fkind'){ ['name','area','menu','memo'].forEach(k => S.tmp.newfood[k] = ($('#f'+k)||{}).value || ''); S.tmp.newfood.date = $('#fdate').value; }
    if(p[0] === 'ttype'){ ['place','area','memo'].forEach(k => S.tmp.newtravel[k] = ($('#t'+k)||{}).value || ''); S.tmp.newtravel.date = $('#tdate').value; }
    render(); return;
  }
  if(a === 'plan'){ runPlan(); return; }
  if(a === 'savecourse'){ if(S.tmp.plan){ S.courses = [S.tmp.plan].concat(S.courses.filter(c => c.id !== S.tmp.plan.id)); save('courses'); toast('코스를 저장했어'); render(); } return; }
  if(a === 'loadcourse'){ S.tmp.plan = S.courses.filter(c => c.id === v)[0]; window.__sy = 0; render(); return; }
  if(a === 'delcourse'){ S.courses = S.courses.filter(c => c.id !== v); save('courses'); render(); return; }

  if(a === 'seg'){ S.tmp.seg = v; render(); return; }
  if(a === 'ttab'){ S.tmp.ttab = v; render(); return; }
  if(a === 'formfood'){ S.tmp.formfood = !S.tmp.formfood; render(); return; }
  if(a === 'fscore'){ ['name','area','menu','memo'].forEach(k => S.tmp.newfood[k] = ($('#f'+k)||{}).value || ''); S.tmp.newfood.date = $('#fdate').value; S.tmp.newfood.score = parseInt(v,10); render(); return; }
  if(a === 'savefood'){
    const f = S.tmp.newfood;
    ['name','area','menu','memo'].forEach(k => f[k] = ($('#f'+k)||{}).value || '');
    f.date = $('#fdate').value;
    if(!f.name.trim()){ toast('가게 이름을 적어줘'); return; }
    S.food = [Object.assign({ id:uid(), by:S.whoami }, f)].concat(S.food);
    save('food'); S.tmp.newfood = null; S.tmp.formfood = false; render(); return;
  }
  if(a === 'delfood'){ S.food = S.food.filter(x => x.id !== v); save('food'); render(); return; }
  if(a === 'aifood'){ runFoodAI(); return; }
  if(a === 'formtravel'){ S.tmp.formtravel = !S.tmp.formtravel; render(); return; }
  if(a === 'savetravel'){
    const f = S.tmp.newtravel;
    ['place','area','memo'].forEach(k => f[k] = ($('#t'+k)||{}).value || '');
    f.date = $('#tdate').value;
    if(!f.place.trim()){ toast('여행지를 적어줘'); return; }
    S.travel = [Object.assign({ id:uid(), by:S.whoami, status:(S.tmp.ttab||'done') }, f)].concat(S.travel);
    save('travel'); S.tmp.newtravel = null; S.tmp.formtravel = false; render(); return;
  }
  if(a === 'deltravel'){ S.travel = S.travel.filter(x => x.id !== v); save('travel'); render(); return; }
  if(a === 'tmove'){ S.travel = S.travel.map(x => x.id === v ? Object.assign({}, x, { status: x.status === 'done' ? 'wish' : 'done' }) : x); save('travel'); render(); return; }
  if(a === 'aitravel'){ runTravelAI(); return; }
  if(a === 'wish'){
    const r = (S.tmp.aitravel.다음여행 || [])[parseInt(v,10)];
    if(r){ S.travel = [{ id:uid(), by:S.whoami, place:r.장소, area:r.지역||'', type:r.유형||'', date:r.가기좋은때||'', memo:r.이유||'', status:'wish' }].concat(S.travel); save('travel'); toast('위시에 담았어'); }
    return;
  }

  if(a === 'tw'){ S.tmp.tasteWho = v; render(); return; }
  if(a === 'savetaste'){
    S.taste[v] = { likes:$('#tlikes').value, dislikes:$('#tdislikes').value, food:$('#tfood').value, travel:$('#ttravel').value, gift:$('#tgift').value, memo:$('#tmemo').value };
    save('taste'); toast(v+'의 취향을 저장했어'); return;
  }
  if(a === 'whoami'){ S.whoami = v; save('whoami'); render(); return; }
  if(a === 'savesettings'){
    S.settings = { me:$('#sme').value||'나', you:$('#syou').value||'너', start:$('#sstart').value, region:$('#sregion').value, key:$('#skey').value.trim() };
    save('settings');
    if([S.settings.me, S.settings.you].indexOf(S.whoami) < 0){ S.whoami = S.settings.me; save('whoami'); }
    toast('저장했어'); render(); return;
  }
  if(a === 'export'){
    const data = { settings:S.settings, taste:S.taste, food:S.food, travel:S.travel, days:S.days, courses:S.courses, images:IMG };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type:'application/json' }));
    const link = document.createElement('a'); link.href = url; link.download = 'hyunabaragi-backup.json'; link.click();
    return;
  }
  if(a === 'import'){
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = async () => {
        try{
          const d = JSON.parse(rd.result);
          if(d.settings){ S.settings = Object.assign({}, S.settings, d.settings, { key:S.settings.key }); save('settings'); }
          ['taste','food','travel','days','courses'].forEach(k => { if(d[k]){ S[k] = d[k]; save(k); } });
          if(d.images) for(const id in d.images){ IMG[id] = d.images[id]; await imgPut(id, d.images[id]); }
          toast('불러왔어'); render();
        }catch(err){ toast('파일을 읽지 못했어'); }
      };
      rd.readAsText(f);
    };
    inp.click(); return;
  }
  if(a === 'movie'){ S.tab = 'movie'; window.__sy = 0; render(); return; }
  if(a === 'msel'){ const i = S.tmp.sel.indexOf(v); if(i >= 0) S.tmp.sel.splice(i,1); else S.tmp.sel.push(v); render(); return; }
  if(a === 'mplay'){ playMovie(false); return; }
  if(a === 'msave'){ playMovie(true); return; }
  if(a === 'confess'){ showConfess(); return; }
});

/* ========================= 시작 ========================= */
(async function init(){
  const ids = [];
  Object.keys(S.days).forEach(k => (S.days[k].photos || []).forEach(p => ids.push(p)));
  for(const id of ids){ const d = await imgGet(id); if(d) IMG[id] = d; }
  const cov = await imgGet('cover'); if(cov) IMG['cover'] = cov;
  render();
})();
</script>
</body>
</html>
