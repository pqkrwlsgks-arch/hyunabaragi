    mk(12,'task','GROWTH',['목표','자격증'],'올해 자격증 취득','연말까지 응시.','neutral',{dueAt:null,duePrecision:'none',needsConfirm:false}),
    mk(15,'record','MONEY',['고정지출'],'구독 두 개 해지','월 2만원 절감.','plus'),
    mk(20,'task','WORK',['회사','보고서'],'시험 결과 보고서','월간 결과 정리.','neutral',{dueAt:null,duePrecision:'none',needsConfirm:false}),
    mk(-1,'event','WORK',['회사','회의'],'정비팀 회의','시험기 점검 일정 협의.','neutral',
      {dueAt:sod(now)+DAY+15*3600000,duePrecision:'exact',needsConfirm:false})
  );
  save.ses(); save.items(); checkDue(); render(); toast('예시 데이터를 넣었습니다.');
}

document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, v=el.dataset.v, id=el.dataset.id, i=+el.dataset.i;
  switch(a){
    case 'tab': { let t=v;
      if(t==='plan'){ t='upcoming'; S.upTab='list'; }
      if(t==='calendar'){ t='upcoming'; S.upTab='cal'; }
      S.tab=t; S.open=null; render(); break; }
    case 'uptab': S.upTab=v; render(); break;
    case 'capture-thought': openCapture('personal','thought'); break;
    case 'capture': openCapture('personal'); break;
    case 'capture-task': openCapture('personal','task'); break;
    case 'capture-event': openCapture('personal','event'); break;
    case 'dictate': micToggle(v); break;
    case 'askjump': S.tab='assist'; render(); break;
    case 'libtab': S.libTab=v; S.ent=null; render(); break;
    case 'topic': S.topic=v; S.sub=null; S.subTopic=v; S.tab='topic'; render(); break;
    case 'sub': S.sub=v||null; S.subTopic=S.topic; render(); break;
    case 'movetopic': S.moveId=id; render(); break;
    case 'settopic': { if(v!=='cancel'){ const it=S.items.find(x=>x.id===S.moveId);
        if(it){ it.topic=v||null; save.items(); toast(v?TOPICS[v].name+'으로 옮겼습니다.':'자동 분류로 되돌렸습니다.'); } }
      S.moveId=null; render(); break; }
    case 'chip': { const label={plan:'오늘 뭐부터 할까?',status:'요즘 나 어때?',week:'이번 주 뭐 했지?'}[v];
      pushChat('me',label); pushChat('ai',localAnswer(v)); render(); break; }
    case 'chatclear': if(confirm('대화 내역을 전부 지웁니다.')){ S.chat=[]; write('lifeos.v5.chat',[]); render(); } break;
    case 'delmsg': { const k=+el.dataset.i;
      S.chat.splice(S.chat[k-1]&&S.chat[k-1].role==='me'?k-1:k, S.chat[k-1]&&S.chat[k-1].role==='me'?2:1);
      write('lifeos.v5.chat',S.chat); render(); break; }
    case 'askclear': { if(S.micKey==='ask') micStop(); S.ask='';
      const b=document.getElementById('askbox'); if(b){ b.value=''; b.focus(); } break; }
    case 'calmove': { const base=S.calMonth!=null?new Date(S.calMonth):new Date();
      S.calMonth=new Date(base.getFullYear(), base.getMonth()+(+v), 1).getTime(); render(); break; }
    case 'calday': S.calDay=+v; render(); break;
    case 'newevent': { const now=Date.now();
      const it={id:uid(),sessionId:null,type:'event',area:'LIFE',tags:[],title:'새 일정',detail:'',
        sentiment:'neutral',occurredAt:+v+9*3600000,createdAt:now,status:'open',
        dueAt:+v+9*3600000,duePrecision:'exact',needsConfirm:false,scope:'personal'};
      S.items.push(it); save.items(); openEdit(it.id); break; }
    case 'capture-rem': { const r=S.items.find(x=>x.id===id); openCapture('personal');
      if(r&&S.capture) S.capture.transcript=r.title+' — '; break; }
    case 'cap-close': closeCapture(true); break;
    case 'cap-back': S.result=null; render(); break;
    case 'cap-scope': S.capture.scope=v; render(); break;
    case 'mic': toggleMic(); break;
    case 'clear': { if(S.micKey) micStop();
      if(S.capture) S.capture.transcript='';
      micBase=''; micFinal=''; micSession='';
      const ta=document.getElementById('draft'); if(ta) ta.value='';
      render(); break; }
    case 'decompose': decompose(); break;
    case 'saveraw': saveRaw(); break;
    case 'commit': commit(); break;
    case 'keep': S.result.items[i]._keep=!S.result.items[i]._keep; render(); break;
    case 'cyc-type': { const it=S.result.items[i]; it.type=TORD[(TORD.indexOf(it.type)+1)%TORD.length]; render(); break; }
    case 'answer': { const it=S.result.items[i]; if(it){ const d=resolveDue(v);
      it._dueAt=d.dueAt; it._precision=d.precision; it._needsConfirm=false; }
      S.result.questions.splice(+el.dataset.q,1); render(); break; }
    case 'tlf': S.tlFilter=v; render(); break;
    case 'open': S.open=S.open===id?null:id; render(); break;
    case 'toggle': { const t=S.items.find(x=>x.id===id);
      if(t){ t.status=t.status==='done'?'open':'done'; t.doneAt=Date.now(); save.items(); checkDue(); render(); } break; }
    case 'setdue': setDue(id,v); break;
    case 'del': S.items=S.items.filter(x=>x.id!==id); save.items(); S.open=null; render(); break;
    case 'quick': quickAdd(); break;
    case 'selmode': S.selMode=!S.selMode; S.sel=[]; render(); break;
    case 'selstart': S.selMode=true; S.sel=[id]; render(); break;
    case 'sendcal': sendToCal(id||'all'); break;
    case 'calway': S.cfg.calWay=v; save.cfg(); render(); toast('방식을 바꿨습니다.'); break;
    case 'calpick': { const k=S.calPick.sel.indexOf(id);
      if(k>=0) S.calPick.sel.splice(k,1); else S.calPick.sel.push(id);
      render(); break; }
    case 'calpickclose': S.calPick=null; render(); break;
    case 'icsfresh': S.icsFresh=!S.icsFresh; render(); break;
    case 'calpickgo': { const picked=S.calPick.sel.map(x=>S.items.find(y=>y.id===x)).filter(Boolean);
      markExported(picked); setTimeout(()=>{ S.calPick=null; render();
        toast('캘린더 화면에서 캘린더와 알림을 고르고 추가를 누르세요.'); }, 900); break; }
    case 'calpickmore': { const picked=S.calPick.sel.map(x=>S.items.find(y=>y.id===x)).filter(Boolean);
      S.calPick=null; openCalHelp(picked.length?picked:icsList('all')); break; }
    case 'savescname': { const el=document.getElementById('scname');
      S.cfg.scName=(el&&el.value.trim())||'Life OS 일정'; save.cfg(); render(); toast('저장했습니다.'); break; }
    case 'calpromptgo': { const ids=S.calPrompt; S.calPrompt=null; sendToCal(ids); break; }
    case 'calpromptno': S.calPrompt=null; render(); break;
    case 'calhelpclose': { if(S.icsUrl){ try{URL.revokeObjectURL(S.icsUrl);}catch(e){} }
      S.icsUrl=null; S.icsList=null; render(); break; }
    case 'sheetdel': { if(confirm('이 항목을 지웁니다.')){ S.items=S.items.filter(x=>x.id!==id);
      save.items(); } checkDue(); render(); break; }
    case 'donetoggle': S.doneOpen=!S.doneOpen; render(); break;
    case 'cleardone': { const days=+v;
      const target=S.items.filter(x=>x.type==='task'&&x.status==='done'&&
        (days===0 || (Date.now()-(x.doneAt||x.createdAt))/DAY>=days));
      if(!target.length){ toast('정리할 게 없습니다.'); break; }
      if(confirm(target.length+'건의 완료 기록을 지웁니다.')){
        const ids=target.map(x=>x.id); S.items=S.items.filter(x=>!ids.includes(x.id));
        save.items(); render(); toast(ids.length+'건 정리했습니다.'); } break; }
    case 'pick': { S.sel = S.sel.includes(id) ? S.sel.filter(x=>x!==id) : S.sel.concat(id); render(); break; }
    case 'selall': {
      const vis = S.tab==='plan'
        ? S.items.filter(i=>i.type==='task'&&i.status==='open').map(i=>i.id)
        : S.items.filter(i=>{ const t=i.dueAt||i.occurredAt||i.createdAt;
            return t&&sod(t)===(S.calDay!=null?S.calDay:sod(Date.now())); }).map(i=>i.id);
      S.sel = S.sel.length===vis.length ? [] : vis; render(); break; }
    case 'seldel': {
      if(!S.sel.length){ toast('선택된 게 없습니다.'); break; }
      if(confirm(S.sel.length+'건을 지웁니다. 되돌릴 수 없습니다.')){
        S.items=S.items.filter(x=>!S.sel.includes(x.id));
        save.items(); const n=S.sel.length; S.sel=[]; S.selMode=false;
        checkDue(); render(); toast(n+'건을 지웠습니다.'); } break; }
    case 'star': { const t=S.items.find(x=>x.id===id); if(t){ t.star=!t.star; save.items(); } render(); break; }
    case 'edit': openEdit(id); break;
    case 'edit-close': S.edit=null; render(); break;
    case 'ed-type': S.edit.type=v; render(); break;
    case 'ed-rep': S.edit.repeat=v||null; render(); break;
    case 'ed-topic': S.edit.topic=v||''; render(); break;
    case 'ed-quick': {
      if(v==='clear'){ S.edit.date=''; S.edit.time=''; }
      else { S.edit.date=quickDate(v); if(!S.edit.time) S.edit.time='09:00'; }
      const de=document.getElementById('e-date'); if(de) de.value=S.edit.date;
      const te=document.getElementById('e-time'); if(te) te.value=S.edit.time;
      document.querySelectorAll('[data-act="ed-quick"]').forEach(b=>{
        const on = b.dataset.v==='clear' ? !S.edit.date : (quickDate(b.dataset.v)===S.edit.date && !!S.edit.date);
        b.classList.toggle('on', on); });
      toast(S.edit.date? S.edit.date+' 로 정했습니다.' : '기한을 지웠습니다.');
      break; }
    case 'edit-save': {
      const e=S.edit, it=S.items.find(x=>x.id===e.id); if(!it){S.edit=null;render();break;}
      it.type=e.type; it.area=e.area; it.repeat=e.repeat||null; it.topic=e.topic||null;
      it.title=(e.title||'').trim()||it.title;
      it.detail=(e.detail||'').trim();
      it.tags=(e.tags||'').split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean).slice(0,5);
      const ts = e.date ? new Date(e.date+'T'+(e.time||'09:00')).getTime() : null;
      if(e.type==='task'||e.type==='event'){ it.dueAt=ts; it.duePrecision=ts?'exact':'none'; it.needsConfirm=false;
        if(e.type==='event'&&ts) it.occurredAt=ts;
        it.lastFiredAt=null; it.exported=null; it.rev=(it.rev||0)+1;
        if(it.status!=='done') it.status='open'; }
      else { it.occurredAt=ts||it.occurredAt; it.dueAt=null;
        it.status='logged'; }
      save.items(); S.edit=null; checkDue(); render(); toast('고쳤습니다.'); break; }
    case 'edit-del': { S.items=S.items.filter(x=>x.id!==S.edit.id); save.items(); S.edit=null;
      checkDue(); render(); toast('지웠습니다.'); break; }
    case 'capture-day': { openCapture('personal');
      if(S.capture){ S.capture.forcedTs=+v; } break; }
    case 'ent': S.ent = S.ent===v?null:v; render(); break;
    case 'askai': askAI(); break;
    case 'simulate': simulate(); break;
    case 'breakdown': breakdown(id); break;
    case 'addaction': { const g=S.items.find(x=>x.id===id); const a=S.goalPlan.actions[i];
      if(a){ const now=Date.now(); const d=resolveDue(a.when);
        S.items.push({id:uid(),sessionId:null,type:'task',area:g?g.area:'BODY',tags:g?(g.tags||[]):[],
          title:a.title||String(a),detail:'목표 "'+(g?g.title:'')+'"에서 나온 행동',sentiment:'neutral',
          occurredAt:now,createdAt:now,status:'open',dueAt:d.dueAt,duePrecision:d.precision,
          needsConfirm:d.needsConfirm,scope:'personal'});
        save.items(); render(); toast('할 일에 넣었습니다.'); } break; }
    case 'rem': { const r=S.items.find(x=>x.id===id); if(r) fireResponse(r,v); break; }
    case 'aitoday': aiToday(); break;
    case 'weekly': weekly(); break;
    case 'testai': testAI(); break;
    case 'prov': S.cfg.provider=v; S.modelList=null; save.cfg(); render(); break;
    case 'savekey': { const k=document.getElementById('apikey').value.trim();
      S.cfg.keys[S.cfg.provider]=k; save.cfg(); render();
      toast(k?'키를 저장했습니다. 이제 모델을 고르세요.':'키를 지웠습니다.'); break; }
    case 'listmodels': { if(S.busy)break;
      const k=document.getElementById('apikey'); if(k&&k.value.trim()){S.cfg.keys[S.cfg.provider]=k.value.trim();save.cfg();}
      S.busy=true; render();
      try{ S.modelList=await fetchModels(); if(!S.modelList.length) toast('쓸 수 있는 모델이 없습니다.'); }
      catch(err){ S.modelList=null; toast('목록 실패: '+err.message); }
      S.busy=false; render(); break; }
    case 'pickmodel': S.cfg.models[S.cfg.provider]=v; save.cfg(); render();
      toast(v+' 선택 · 연결 확인을 눌러 보세요.'); break;
    case 'toggleWork': S.cfg.sendWork=!S.cfg.sendWork; save.cfg(); render(); break;
    case 'toggleNotify': {
      if(!S.cfg.notify && 'Notification' in window){
        const p=await Notification.requestPermission();
        if(p!=='granted'){ toast('알림 권한이 거부됐습니다.'); break; } }
      S.cfg.notify=!S.cfg.notify; save.cfg(); render(); break; }
    case 'import': document.getElementById('photoInput').click(); break;
    case 'viewer': S.viewer=id; showViewer(); break;
    case 'closeview': S.viewer=null; document.querySelectorAll('.viewer').forEach(x=>x.remove()); break;
    case 'caption': captionPhoto(); break;
    case 'delphoto': await delThumb(S.viewer); S.photos=S.photos.filter(p=>p.id!==S.viewer);
      save.photos(); S.viewer=null; document.querySelectorAll('.viewer').forEach(x=>x.remove()); render(); break;
    case 'delphotos': if(confirm('사진을 전부 지웁니다.')){ for(const p of S.photos) await delThumb(p.id);
      S.photos=[]; save.photos(); render(); toast('사진을 모두 지웠습니다.'); } break;
    case 'export': exportBackup(); break;
    case 'importbk': document.getElementById('backupInput').click(); break;
    case 'install': { if(deferredInstall){ deferredInstall.prompt();
        deferredInstall.userChoice.finally(()=>{ deferredInstall=null; render(); }); }
      else toast('크롬 오른쪽 위 ⋮ 메뉴에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 누르세요.'); break; }
    case 'hideinstall': S.cfg.hideInstall=true; save.cfg(); render(); break;
    case 'marked': markExported(pendingExports()); break;
    case 'icsall': downloadICS(pendingExports(),'lifeos-알림'); break;
    case 'icsallforce': downloadICS(S.items.filter(x=>x.type==='event'&&x.status!=='done'),'lifeos-전체'); break;
    case 'seed': seed(); break;
    case 'reset': if(confirm('모든 기록을 지웁니다. 되돌릴 수 없습니다.')){
      S.sessions=[];S.items=[];S.events=[];S.cache={};
      save.ses();save.items();save.ev();save.cache(); S.tab='home'; render(); toast('모두 지웠습니다.'); } break;
  }
});
/* 안드로이드 뒤로가기 버튼·제스처 연동 */
function layerOpen(){ return !!(S.calPick||S.icsUrl||S.calPrompt||S.edit||S.viewer||S.capture||S.selMode); }
let histPushed=false;
function syncHistory(){
  const need=layerOpen()||S.tab!=='home';
  if(need&&!histPushed){ try{ history.pushState({lo:1},''); histPushed=true; }catch(e){} }
}
window.addEventListener('popstate',()=>{
  histPushed=false;
  if(layerOpen()||S.tab!=='home'){ goBack(); }
  syncHistory();
});

/* 오른쪽으로 밀면 뒤로 (모달 닫기 / 홈으로) */
let bk=null;
document.addEventListener('touchstart', e=>{
  if(e.target.closest('.swipe')) { bk=null; return; }
  const t=e.touches[0];
  bk={x:t.clientX, y:t.clientY, edge:t.clientX<48};
},{passive:true});
document.addEventListener('touchend', e=>{
  if(!bk) return; const t=e.changedTouches[0];
  const dx=t.clientX-bk.x, dy=Math.abs(t.clientY-bk.y);
  const far = bk.edge ? (!IS_ANDROID && dx>55) : dx>130;   // 안드로이드는 가장자리 제스처를 시스템이 씀
  if(far && dy<70) goBack();
  bk=null;
},{passive:true});
function goBack(){
  if(S.calPick){ S.calPick=null; render(); return; }
  if(S.icsUrl){ if(S.icsUrl){try{URL.revokeObjectURL(S.icsUrl);}catch(e){}} S.icsUrl=null; S.icsList=null; render(); return; }
  if(S.calPrompt){ S.calPrompt=null; render(); return; }
  if(S.edit){ S.edit=null; render(); return; }
  if(S.viewer){ S.viewer=null; document.querySelectorAll('.viewer').forEach(x=>x.remove()); return; }
  if(S.capture){ closeCapture(true); return; }
  if(S.selMode){ S.selMode=false; S.sel=[]; render(); return; }
  if(['topic','library','review','settings'].includes(S.tab)){ S.tab='home'; render(); return; }
  if(S.tab!=='home'){ S.tab='home'; render(); }
}

/* 왼쪽으로 밀면 수정·선택·지우기 */
let sw=null;
document.addEventListener('touchstart', e=>{
  const f=e.target.closest('.swipe');
  document.querySelectorAll('.swipe.open').forEach(o=>{ if(o!==f) o.classList.remove('open'); });
  if(!f) return;
  sw={el:f, x0:e.touches[0].clientX, y0:e.touches[0].clientY, dx:0, lock:null};
},{passive:true});
document.addEventListener('touchmove', e=>{
  if(!sw) return;
  const dx=e.touches[0].clientX-sw.x0, dy=e.touches[0].clientY-sw.y0;
  if(sw.lock===null){ if(Math.abs(dx)>8||Math.abs(dy)>8) sw.lock=Math.abs(dx)>Math.abs(dy)?'x':'y'; }
  if(sw.lock!=='x') return;
  sw.dx=dx;
  const base=sw.el.classList.contains('open')?-186:0;
  const t=Math.max(Math.min(base+dx,0),-186);
  const fr=sw.el.querySelector('.front'); if(fr){ fr.style.transition='none'; fr.style.transform='translateX('+t+'px)'; }
},{passive:true});
function swEnd(){
  if(!sw) return;
  const fr=sw.el.querySelector('.front');
  if(fr){ fr.style.transition=''; fr.style.transform=''; }
  if(sw.lock==='x'){
    if(sw.dx<-50) sw.el.classList.add('open');
    else if(sw.dx>30) sw.el.classList.remove('open');
  }
  sw=null;
}
document.addEventListener('touchend', swEnd, {passive:true});
document.addEventListener('touchcancel', swEnd, {passive:true});

document.getElementById('photoInput').addEventListener('change',e=>{importPhotos(e.target.files);e.target.value='';});
document.getElementById('backupInput').addEventListener('change',e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
checkDue(); render();
(function launchAct(){
  try{
    const a=new URLSearchParams(location.search).get('act'); if(!a) return;
    history.replaceState(null,'',location.pathname);
    setTimeout(()=>{ if(a==='capture') openCapture('personal');
      else if(a==='thought') openCapture('personal','thought');
      else if(a==='task') openCapture('personal','task'); },300);
  }catch(e){}
})();
setInterval(()=>{ const before=(S.due||[]).length; checkDue();
  if((S.due||[]).length!==before && !S.capture) render(); }, 60000);
</script>
